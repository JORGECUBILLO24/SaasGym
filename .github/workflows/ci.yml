name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Un push nuevo a la misma rama cancela la corrida anterior (ahorra minutos de Actions).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detecta qué partes cambiaron para correr solo los jobs necesarios. Un job que no aplica
  # queda como "skipped", que GitHub cuenta como aprobado (no bloquea el merge).
  # Si cambia este archivo, corren los tres; con workflow_dispatch también.
  changes:
    name: Detectar cambios
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      api: ${{ steps.filtro.outputs.api }}
      web: ${{ steps.filtro.outputs.web }}
      android: ${{ steps.filtro.outputs.android }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Filtrar por carpeta
        id: filtro
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api:
              - 'SpartanGymAPI/**'
              - '.github/workflows/ci.yml'
            web:
              - 'SpartanGymWeb/**'
              - '.github/workflows/ci.yml'
            android:
              - 'SpartanGymApp/**'
              - '.github/workflows/ci.yml'

  api:
    name: API tests
    needs: changes
    if: needs.changes.outputs.api == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Servicios reales para las pruebas de integracion (concurrencia de ventas y pagos contra
    # PostgreSQL, almacen de sesiones QR contra Redis). Sin estas variables esas pruebas se
    # omiten y el resto corre igual que antes.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: saasgym_it
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d saasgym_it"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SAASGYM_IT_DB_URL: jdbc:postgresql://localhost:5432/saasgym_it
      SAASGYM_IT_DB_USER: postgres
      SAASGYM_IT_DB_PASSWORD: postgres
      SAASGYM_IT_REDIS_URL: redis://localhost:6379
    defaults:
      run:
        working-directory: SpartanGymAPI
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run tests
        run: ./mvnw -B --no-transfer-progress test

  web:
    name: Web lint and build
    needs: changes
    if: needs.changes.outputs.web == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: SpartanGymWeb
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: SpartanGymWeb/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      # Comprobacion de tipos de los modulos ya migrados a TypeScript (ver docs/TYPESCRIPT_MIGRATION.md).
      - name: Type check
        run: npm run typecheck
      - name: Unit and component tests
        run: npm test
      - name: Build
        run: npm run build

  android:
    name: Android unit tests
    needs: changes
    if: needs.changes.outputs.android == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: SpartanGymApp
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36.1" "build-tools;36.0.0"
      - name: Run unit tests
        run: ./gradlew test --no-daemon
      # Verifica que ambos tipos de build compilan: debug apunta al emulador (10.0.2.2) y
      # release a la API de produccion, y cada uno lee su URL de un BuildConfig distinto.
      - name: Assemble debug and release
        run: ./gradlew assembleDebug assembleRelease --no-daemon
