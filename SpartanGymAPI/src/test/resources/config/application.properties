# Solo para pruebas: se suma a application.properties (no lo reemplaza).
# Las pruebas sin base real no deben conectarse; IntegracionPostgresBase lo vuelve a encender.
spring.flyway.enabled=false
# Sin base real Hibernate no puede detectar el dialecto conectándose: se fija solo en pruebas.
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
